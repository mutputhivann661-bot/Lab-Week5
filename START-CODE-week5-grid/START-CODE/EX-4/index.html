    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">Learning</div>
            <ul class="nav-links">
                <li>Dashboard</li>
                <li>My Course</li>
                <li>Assignments</li>
                <li>Notes</li>
                <li>Calender</li>
            </ul>
            <div class="setting">Setting</div>

        </div>
        <div class="main">
            <div class="dashboard">Dashboard</div>
            <div class="card a">Card1</div>
            <div class="card b">Card2</div>
            <div class="card c">Card3</div>
            <div class="card d">Card4</div>
            <div class="card e">Card5</div>
            <div class="card f">Card6</div>
        </div>
        <div class="r-sidebar">
            <div class="sidebar-profile">
                <img src="https://via.placeholder.com/40" alt="User Avatar" class="profile-avatar">
                <div class="profile-info">
                    <span class="profile-name">Bun Chhert</span>
                    <span class="profile-role">Student</span>
                </div>
            </div>
            <div class="card quiz">Quiz</div>
            <div class="card flashcard">Flash Card</div>
            <div class="card reminder">Reminder </div>
        </div>
    </div>
</body>
</html>
